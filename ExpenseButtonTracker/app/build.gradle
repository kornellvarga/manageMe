plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('MANAGEME_KEYSTORE_FILE') ?: "${rootProject.projectDir}/release-keystore.p12"
def releaseStorePassword = System.getenv('MANAGEME_KEYSTORE_PASSWORD') ?: 'missing'
def releaseKeyAlias = System.getenv('MANAGEME_KEY_ALIAS') ?: 'manageme'
def releaseKeyPassword = System.getenv('MANAGEME_KEY_PASSWORD') ?: 'missing'

android {
    namespace 'com.example.expensebuttontracker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.expensebuttontracker.finance'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '2.4.2'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        stableRelease {
            storeFile file(releaseKeystorePath)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
            storeType 'PKCS12'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.stableRelease
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
