name: Apply update manager patch

on:
  push:
    branches: [feature/in-app-updates-v232]
    paths:
      - "scripts/patch_update_manager_pending.py"
      - ".github/workflows/apply-update-manager-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/in-app-updates-v232
      - run: python scripts/patch_update_manager_pending.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ExpenseButtonTracker/app/src/main/java/com/example/expensebuttontracker/update/UpdateManager.java
          git diff --cached --quiet || git commit -m "Avoid redownloading a pending app update"
          git push origin HEAD:feature/in-app-updates-v232
