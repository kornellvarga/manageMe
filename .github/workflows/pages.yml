name: Publish ManageMe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MANAGEME_KEYSTORE_BASE64: ${{ secrets.MANAGEME_KEYSTORE_BASE64 }}
      MANAGEME_KEYSTORE_PASSWORD: ${{ secrets.MANAGEME_KEYSTORE_PASSWORD }}
      MANAGEME_KEY_ALIAS: ${{ secrets.MANAGEME_KEY_ALIAS }}
      MANAGEME_KEY_PASSWORD: ${{ secrets.MANAGEME_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Require permanent Android signing secrets
        run: |
          test -n "$MANAGEME_KEYSTORE_BASE64" || { echo "::error::MANAGEME_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$MANAGEME_KEYSTORE_PASSWORD" || { echo "::error::MANAGEME_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$MANAGEME_KEY_ALIAS" || { echo "::error::MANAGEME_KEY_ALIAS is missing"; exit 1; }
          test -n "$MANAGEME_KEY_PASSWORD" || { echo "::error::MANAGEME_KEY_PASSWORD is missing"; exit 1; }

      - name: Restore permanent Android signing key
        working-directory: ExpenseButtonTracker
        run: printf '%s' "$MANAGEME_KEYSTORE_BASE64" | base64 --decode > release-keystore.p12

      - name: Build the unified signed Android APK and update manifest
        working-directory: ExpenseButtonTracker
        env:
          MANAGEME_KEYSTORE_FILE: ${{ github.workspace }}/ExpenseButtonTracker/release-keystore.p12
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" ../web/public/ManageMe.apk

          VERSION_CODE=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)
          VERSION_NAME=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME" && test -n "$APK_SHA256"

          cat > ../web/public/update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://kornellvarga.github.io/manageMe/ManageMe.apk",
            "sha256": "$APK_SHA256"
          }
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static GitHub Pages app
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /manageMe
          NEXT_PUBLIC_SITE_URL: https://kornellvarga.github.io/manageMe/
          NEXT_PUBLIC_MANAGEME_API_URL: ${{ vars.MANAGEME_API_URL }}
        run: |
          npm ci
          npm run check

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
