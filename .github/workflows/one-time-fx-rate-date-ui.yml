name: One-time FX rate date UI patch

on:
  push:
    branches: [feature/show-fx-rate-date]

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply UI patch
        run: python3 scripts/one_time_fx_rate_date_ui_patch.py
      - name: Build Android APK
        working-directory: ExpenseButtonTracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit patched app and remove one-time machinery
        run: |
          rm scripts/one_time_fx_rate_date_ui_patch.py
          rm .github/workflows/one-time-fx-rate-date-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show locked FX rate date when editing entries"
          git push origin HEAD:feature/show-fx-rate-date
