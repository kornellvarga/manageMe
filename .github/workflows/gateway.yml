name: Deploy ManageMe gateway

on:
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Verify gateway
        working-directory: gateway
        run: |
          npm ci
          npm run check
          npm test
      - name: Deploy Cloudflare Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: gateway
        run: npm run deploy
      - name: Report skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Gateway verification passed, but deployment was skipped because the Cloudflare repository secrets are not configured."
