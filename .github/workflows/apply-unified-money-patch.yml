name: Apply unified money patch

on:
  push:
    branches: [feature/unified-money-v23]
    paths:
      - "scripts/apply_unified_money_patch.py"
      - ".github/workflows/apply-unified-money-patch.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/apply_unified_money_patch.py"
      - ".github/workflows/apply-unified-money-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-money-v23
      - name: Apply source transformation
        run: python scripts/apply_unified_money_patch.py
      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ExpenseButtonTracker gateway
          git diff --cached --quiet || git commit -m "Apply unified Money entry and dedupe changes"
          git push origin HEAD:feature/unified-money-v23
