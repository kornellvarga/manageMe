name: Implement finance planning

on:
  push:
    branches: ["feature/finance-planning"]
    paths:
      - "tools/implement_finance_planning.py"
      - ".github/workflows/implement-finance-planning.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-planning

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply coordinated feature patch
        run: python tools/implement_finance_planning.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Verify gateway
        working-directory: gateway
        run: |
          npm ci
          npm run check
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Android debug build
        working-directory: ExpenseButtonTracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified implementation
        run: |
          rm -f tools/implement_finance_planning.py .github/workflows/implement-finance-planning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "implement monthly finance planning"
          git push origin HEAD:feature/finance-planning
