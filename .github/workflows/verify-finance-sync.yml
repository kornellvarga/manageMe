name: Verify finance sync

on:
  push:
    branches: [feature/finance-sync]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install gateway dependencies
        working-directory: gateway
        run: npm ci
      - name: Type-check gateway
        working-directory: gateway
        run: npm run check
      - name: Test gateway
        working-directory: gateway
        run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Lint and build web app
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /manageMe
          NEXT_PUBLIC_SITE_URL: https://kornellvarga.github.io/manageMe/
          NEXT_PUBLIC_MANAGEME_API_URL: https://manageme-gateway.kornel-718.workers.dev
        run: npm run check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require versionCode bump when Android changes
        if: github.event_name == 'pull_request'
        run: |
          BASE='${{ github.event.pull_request.base.sha }}'
          if git diff --quiet "$BASE" HEAD -- ExpenseButtonTracker; then
            exit 0
          fi
          CURRENT=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" ExpenseButtonTracker/app/build.gradle | head -1)
          PREVIOUS=$(git show "$BASE:ExpenseButtonTracker/app/build.gradle" | sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" | head -1)
          test -n "$CURRENT" && test -n "$PREVIOUS"
          if [ "$CURRENT" -le "$PREVIOUS" ]; then
            echo "::error::Android files changed but versionCode did not increase ($PREVIOUS -> $CURRENT)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        working-directory: ExpenseButtonTracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
