name: Apply transaction-date FX lock patch

on:
  push:
    branches: [feature/locked-transaction-fx]
    paths:
      - .github/workflows/one-time-locked-fx-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/locked-transaction-fx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Repair generated regex literals and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/one_time_locked_fx_patch.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              r"r'    private void refreshRateStatus\\(\\) \\{.*?\\n    \\}\\n\\n    private void refreshSyncStatus'",
              r"r'    private void refreshRateStatus\(\) \{.*?\n    \}\n\n    private void refreshSyncStatus'",
          )
          text = text.replace(
              r"r'    private String rateStatusText\\(\\) \\{.*?\\n    \\}\\n\\n    private Long convertCents'",
              r"r'    private String rateStatusText\(\) \{.*?\n    \}\n\n    private Long convertCents'",
          )
          path.write_text(text, encoding="utf-8")
          PY
          python scripts/one_time_locked_fx_patch.py

      - name: Build Android APK
        working-directory: ExpenseButtonTracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Lock money values to transaction-date FX"
          git push origin HEAD:feature/locked-transaction-fx
