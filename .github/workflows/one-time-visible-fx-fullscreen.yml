name: Apply visible FX and fullscreen patch

on:
  push:
    branches: [feature/visible-fx-and-fullscreen]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visible-fx-and-fullscreen
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply patch
        run: python scripts/one_time_visible_fx_fullscreen_patch.py

      - name: Build Android APK
        working-directory: ExpenseButtonTracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified app changes and remove one-time machinery
        run: |
          rm scripts/one_time_visible_fx_fullscreen_patch.py
          rm .github/workflows/one-time-visible-fx-fullscreen.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Show per-entry FX dates and use fullscreen UI"
          git push origin HEAD:feature/visible-fx-and-fullscreen
