name: Apply money dialog fix

on:
  push:
    branches: [fix/money-dialog-and-subsecond-dedupe]
    paths:
      - "scripts/fix_money_dialog_and_dedupe.py"
      - ".github/workflows/apply-money-dialog-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/money-dialog-and-subsecond-dedupe
      - name: Apply patch
        run: python scripts/fix_money_dialog_and_dedupe.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ExpenseButtonTracker gateway
          git diff --cached --quiet || git commit -m "Show entry actions and dedupe sub-second imports"
          git push origin HEAD:fix/money-dialog-and-subsecond-dedupe
