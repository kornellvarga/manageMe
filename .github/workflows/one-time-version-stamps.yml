name: Apply version stamps

on:
  push:
    branches: [feature/version-stamps]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/version-stamps
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply version stamp patch
        run: python scripts/one_time_version_stamp_patch.py
      - name: Build Android APK
        working-directory: ExpenseButtonTracker
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Remove one-time patch machinery
        run: |
          rm scripts/one_time_version_stamp_patch.py
          rm .github/workflows/one-time-version-stamps.yml
      - name: Commit verified app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show app version on ManageMe and money tracker"
          git push origin HEAD:feature/version-stamps
